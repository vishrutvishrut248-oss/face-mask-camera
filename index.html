*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:white;font:14px system-ui,-apple-system,sans-serif;overflow:hidden}button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid #d6ffb1;outline-offset:5px}[hidden]{display:none!important}#app{height:100dvh;width:100%;position:relative;isolation:isolate}video{position:absolute;width:100%;height:100%;object-fit:contain;background:#050505}video.mirror{transform:scaleX(-1)}.top{position:absolute;top:0;left:0;right:0;padding:max(20px,env(safe-area-inset-top)) 22px 36px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#0009,transparent);gap:12px}.mode{border:1px solid #ffffff30;border-radius:30px;padding:9px 14px;background:#161616a6;backdrop-filter:blur(12px);font-size:12px;letter-spacing:.06em;font-weight:650;max-width:70%;text-align:left}.live{font-size:11px;color:#cacaca;display:block;letter-spacing:0;margin-top:4px;font-weight:400}.icon{height:44px;min-width:44px;border-radius:50%;background:#202020aa;display:inline-grid;place-items:center;backdrop-filter:blur(12px)}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.bottom{position:absolute;bottom:0;left:0;right:0;padding:50px 28px max(28px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#000b);display:flex;align-items:center;justify-content:center;gap:42px}.record{width:80px;height:80px;border-radius:50%;border:3px solid white;background:#ffffff15;padding:6px;display:grid;place-items:center}.record span{display:block;background:#ff433e;border-radius:50%;width:60px;height:60px;transition:all .2s}.record.recording span{border-radius:7px;width:29px;height:29px}.timer{position:absolute;top:max(85px,calc(env(safe-area-inset-top) + 65px));left:50%;transform:translateX(-50%);background:#bd2626 eter{bottom:108px;max-width:95vw;white-space:normal;text-align:center;font-size:9px}

</style></head><body><main id="app"><video id="preview" playsinline autoplay muted></video><canvas id="graded" hidden></canvas><div id="focus-ring" class="focus-ring" hidden></div>
<div class="top" hidden id="controls"><button class="mode" id="mode" aria-label="Recording quality" aria-expanded="false">Starting…</button><div class="top-actions"><button class="icon pro-label" id="pro" aria-label="Pro controls" aria-expanded="false">PRO</button><button class="icon" id="fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div>
<div id="quality" hidden><button data-profile="auto" aria-pressed="true">4K · 60 preferred<small>Best mode your camera supports</small></button><button data-profile="smooth">1080p · 60 preferred<small>Prioritize motion</small></button><button data-profile="light">720p · 30 preferred<small>Lower storage & heat</small></button></div>

<div class="bottom" id="capture" hidden><button class="icon" id="mic" aria-label="Microphone on" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/></svg></button><button class="record" id="record" aria-label="Start recording"><span></span></button><button class="icon" id="flip" aria-label="Switch camera"><svg viewBox="0 0 24 24"><path d="M8 5H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3M9 5l3-3 3 3M9 9l3 3 3-3"/><circle cx="12" cy="16" r="2"/></svg></button></div>
<div id="looks" class="looks" aria-label="Swipe cinematic looks" hidden></div><section id="pro-panel" class="panel" hidden><header><h2>Pro studio</h2><button id="pro-close" class="icon" aria-label="Close Pro controls">✕</button></header><div id="grade-controls"></div><h3>RECORDING OUTPUT</h3><label for="output-size">Effects resolution</label><select id="output-size"><option value="1080">1080p preferred · balanced</option><option value="2160">4K preferred · heavier processing</option><option value="720">720p preferred · lighter</option></select><p>Never upscaled. Effects are saved in your video. Processing can reduce FPS.</p><h3>CAMERA HARDWARE</h3><div id="hardware"></div></section><a id="save" hidden download>↓ Save video</a><div id="notice" role="status" hidden></div>
<div class="gate" id="gate"><svg style="width:42px;height:42px;color:#d9ffb6" viewBox="0 0 24 24"><path d="M8 5l2-2h4l2 2h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><circle cx="12" cy="12" r="4"/></svg><h1>Just you. Your camera.</h1><button id="start">Open camera</button><p id="error" role="alert" hidden></p></div></main>

<script>
'use strict';
const $=id=>document.getElementById(id), video=$('preview');
let grade=null;
let stream=null,audio=null,recorder=null,chunks=[],facing='environment',profile='auto',busy=false,wantsMic=true,startedAt=0,ticker=null,blobURL=null,noticeTimer=null,wake=null,recordedBytes=0,frameSamples=[],lastVideoTime=null,observedFPS=0,sessionMode='',cameraEpoch=0;
const profiles={auto:[[3840,2160,60],[3840,2160,30],[1920,1080,60],[1920,1080,30],[1280,720,60],[1280,720,30]],smooth:[[1920,1080,60],[1280,720,60],[1920,1080,30],[1280,720,30]],light:[[1280,720,30],[640,480,30]]};
function notice(text){$('notice').textContent=text;$('notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').hidden=true,6500)}
function active(){return recorder&&recorder.state!=='inactive'}
function lock(on){busy=on;$('output-size').disabled=on||active();for(const id of ['flip','mode','mic'])$(id).disabled=on||active();$('record').disabled=on||!stream||!window.MediaRecorder}
function stopTracks(s){if(s)s.getTracks().forEach(t=>t.stop())}
function dimensions(s){return [s.width||video.videoWidth,s.height||video.videoHeight]}
function refreshMode(){if(!stream)return;const s=stream.getVideoTracks()[0].getSettings(),[w,h]=dimensions(s);sessionMode=`${w} × ${h}`;const rate=s.frameRate?`${Math.round(s.frameRate*10)/10} FPS`:'FPS unknown';$('mode').textContent=`${sessionMode} · ${rate}`;const label=document.createElement('span');label.className='live';label.textContent='Camera mode · '+(profile==='auto'?'4K/60 preferred':profile==='smooth'?'1080/60 preferred':'720/30 preferred');$('mode').appendChild(label)}
async function openCamera(){if(active()||busy)return;lock(true);$('error').hidden=true;$('quality').hidden=true;$('mode').setAttribute('aria-expanded','false');cameraEpoch++;stopTracks(stream);stream=null;video.srcObject=null;frameSamples=[];lastVideoTime=null;observedFPS=0;
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera requires HTTPS and a supported browser.');
  let candidate=null,lastError=null;
  for(const [width,height,frameRate] of profiles[profile]){
   try{candidate=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{exact:width},height:{exact:height},frameRate:{exact:frameRate}},audio:false});break}
   catch(e){lastError=e;if(['NotAllowedError','SecurityError','NotFoundError','NotReadableError'].includes(e.name))throw e}
  }
  if(!candidate)candidate=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:profiles[profile][0][0]},height:{ideal:profiles[profile][0][1]},frameRate:{ideal:profiles[profile][0][2]}},audio:false});
  stream=candidate;video.srcObject=stream;await video.play();video.classList.toggle('mirror',stream.getVideoTracks()[0].getSettings().facingMode==='user');
  stream.getVideoTracks()[0].onended=()=>{notice('Camera disconnected. Open camera again.');if(active())stopRecording();$('gate').hidden=false;$('start').textContent='Reopen camera';$('record').disabled=true};
  $('gate').hidden=true;$('controls').hidden=false;$('capture').hidden=false;$('meter').hidden=false;refreshMode();
  setupGrade();
  try{buildHardware()}catch(e){$('hardware').textContent='Pro hardware controls unavailable on this browser. Camera recording is still available.';console.warn('Optional hardware controls:',e)}
  if(!window.MediaRecorder)notice('This browser can preview, but cannot record. Try current Safari or Chrome.');
 }catch(e){stopTracks(stream);stream=null;$('gate').hidden=false;$('error').hidden=false;$('error').textContent=e.name==='NotAllowedError'?'Allow camera access in browser settings, then try again.':e.message;$('start').textContent='Try again';$('controls').hidden=true;$('capture').hidden=true}
 finally{lock(false);$('start').disabled=false}
}
function mime(){for(const m of ['video/mp4;codecs=avc1.640033,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'])if(MediaRecorder.isTypeSupported(m))return m;return ''}
function time(){let sec=Math.floor((performance.now()-startedAt)/1000);$('timer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
async function startRecording(){if(busy||!stream||active())return;lock(true);$('save').hidden=true;chunks=[];recordedBytes=0;stopTracks(audio);audio=null;
 try{
  if(wantsMic){try{audio=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false})}catch(e){notice('Microphone unavailable. Recording video without audio.')}}
  if(grade?.failed)throw Error('Effects renderer unavailable. Reload before recording.');
  const cameraSettings=stream.getVideoTracks()[0].getSettings();
  const visual=grade?grade.capture(cameraSettings.frameRate):stream;
  const output=new MediaStream([...visual.getVideoTracks(),...(audio?audio.getAudioTracks():[])]),s=grade?{width:grade.canvas.width,height:grade.canvas.height,frameRate:cameraSettings.frameRate}:cameraSettings;
  const pixels=(s.width||1920)*(s.height||1080),fps=s.frameRate||30;
  const bitrate=Math.round(Math.max(8000000,Math.min(100000000,pixels*fps*.16)));
  let options={videoBitsPerSecond:bitrate,audioBitsPerSecond:192000};const type=mime();if(type)options.mimeType=type;
  try{recorder=new MediaRecorder(output,options)}catch(e){recorder=new MediaRecorder(output,type?{mimeType:type}:{})}
  recorder.ondataavailable=e=>{if(e.data.size){chunks.push(e.data);recordedBytes+=e.data.size}};
  recorder.onerror=e=>{notice('Recording error. Saving any captured video.');if(active())stopRecording()};
  recorder.onstop=()=>{
   clearInterval(ticker);grade?.stopCapture();stopTracks(audio);audio=null;if(wake){wake.release().catch(()=>{});wake=null}
   $('timer').hidden=true;$('record').classList.remove('recording');$('record').setAttribute('aria-label','Start recording');
   const type=recorder.mimeType||chunks[0]?.type||'video/webm',blob=new Blob(chunks,{type});chunks=[];
   if(blob.size){if(blobURL)URL.revokeObjectURL(blobURL);blobURL=URL.createObjectURL(blob);$('save').href=blobURL;$('save').download=`camera-${new Date().toISOString().replace(/[:.]/g,'-')}.${type.includes('mp4')?'mp4':'webm'}`;$('save').textContent=`↓ Save video · ${(blob.size/1048576).toFixed(1)} MB`;$('save').hidden=false}else notice('No video was captured. Please try another browser.');
   lock(false);
  };
  recorder.start(1000);startedAt=performance.now();$('timer').hidden=false;$('record').classList.add('recording');$('record').setAttribute('aria-label','Stop recording');time();ticker=setInterval(time,250);
  if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{if(active())wake=w;else w.release()}).catch(()=>{});
 }catch(e){grade?.stopCapture();stopTracks(audio);audio=null;notice('Cannot record: '+e.message)}finally{lock(false)}
}
function stopRecording(){if(busy||!active())return;lock(true);recorder.stop()}
$('start').onclick=()=>{$('start').disabled=true;openCamera()};$('record').onclick=()=>active()?stopRecording():startRecording();
$('flip').onclick=()=>{if(active()||busy)return;facing=facing==='environment'?'user':'environment';openCamera()};
$('mic').onclick=()=>{wantsMic=!wantsMic;$('mic').classList.toggle('off',!wantsMic);$('mic').setAttribute('aria-pressed',String(wantsMic));$('mic').setAttribute('aria-label',wantsMic?'Microphone on':'Microphone off');notice(wantsMic?'Microphone on':'Microphone off')};
$('mode').onclick=()=>{$('quality').hidden=!$('quality').hidden;$('mode').setAttribute('aria-expanded',String(!$('quality').hidden))};
$('quality').onclick=e=>{const b=e.target.closest('[data-profile]');if(!b||busy||active())return;profile=b.dataset.profile;for(const el of $('quality').querySelectorAll('button'))el.setAttribute('aria-pressed',String(el===b));openCamera()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('app').requestFullscreen)await $('app').requestFullscreen();else notice('Use Add to Home Screen for a fullscreen camera on this browser.')}catch(e){notice('Fullscreen is unavailable in this browser.')}};
// Actual delivered preview frames, separate from camera-requested settings.
if(video.requestVideoFrameCallback){const tick=(now,meta)=>{if(lastVideoTime!==null&&meta.mediaTime>lastVideoTime){frameSamples.push(meta.mediaTime-lastVideoTime);if(frameSamples.length>90)frameSamples.shift();observedFPS=frameSamples.length/frameSamples.reduce((a,b)=>a+b,0)}lastVideoTime=meta.mediaTime;video.requestVideoFrameCallback(tick)};video.requestVideoFrameCallback(tick)}
setInterval(()=>{if(!stream)return;const fps=grade?`${grade.canvas.width}×${grade.canvas.height} output · ${Math.round(grade.fps)} processed fps`:(observedFPS?`${Math.round(observedFPS)} delivered fps`:'Measuring frames…');const rate=active()&&recorder.videoBitsPerSecond?` · encoder target ${Math.round(recorder.videoBitsPerSecond/1000000)} Mbps`:'';$('meter').textContent=fps+rate},1500);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active()){stopRecording();notice('Recording stopped when camera went into background.')}});
window.addEventListener('beforeunload',e=>{if(active()) {e.preventDefault();e.returnValue=''}});
window.addEventListener('pagehide',()=>{stopTracks(stream);stopTracks(audio);grade?.stopCapture();if(blobURL)URL.revokeObjectURL(blobURL)});
window.__camera={grade:()=>grade,settings:()=>stream?.getVideoTracks()[0].getSettings(),status:()=>({recording:!!active(),busy,observedFPS,profile,facing,recordedBytes}),stop:stopRecording};
</script><script src="pro.js?v=pro-fix-2"></script></body></html>
